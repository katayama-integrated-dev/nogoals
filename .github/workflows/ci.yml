# CI for the claim: build + tests + axiom audit + count-drift check per commit.
# "0 sorries" is enforced at kernel level by NoGoals/Test/Axioms.lean (it fails the
# build on sorryAx or any undisclosed axiom); verify.sh fails on README drift.
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (pinned toolchain from lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache lake artifacts
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build, test, audit, check counts
        run: ./verify.sh
